spring:
  application:
    name: webSocker

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  main:
    banner-mode: console
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  servlet:
    multipart:
      enabled: true
      max-file-size: 6MB
      max-request-size: 12MB

logging:
  level:
    com:
      project:
        nagarSetu: trace

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

springdoc:
  enable-default-api-docs: true

jwt:
  secret: "This-is-the-secret-jwt-code-for-the-authentication$1234455"

assignment:
  scoring:
    load-weight-per-active-issue: ${ASSIGNMENT_LOAD_WEIGHT:100.0}
    high-critical-distance-weight: ${ASSIGNMENT_HIGH_DISTANCE_WEIGHT:50.0}
    normal-distance-weight: ${ASSIGNMENT_NORMAL_DISTANCE_WEIGHT:10.0}
    fairness-hourly-bonus: ${ASSIGNMENT_FAIRNESS_HOURLY_BONUS:2.0}
    no-assignment-fairness-bonus: ${ASSIGNMENT_NO_ASSIGNMENT_BONUS:500.0}
    starvation-gap-threshold: ${ASSIGNMENT_STARVATION_GAP:10}
